<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register your business on WorldLink Business.">
  <title>Register Your Business | WorldLink Business</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin-bottom: 10px;
    }

    .form-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5df;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .note {
      background: #eef5fa;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 22px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 6px;
      background: #102a43;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #247ba0;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Register Your Business</h1>
      <p>Start building your business presence.</p>
    </div>

    <div class="form-card">

      <div class="note">
  <strong>Welcome to WorldLink Business!</strong>
  Submit your business details to create your business listing.
  Your information will be processed by our registration system.
</div>
      <form id="businessForm">
        <div class="field">
          <label for="businessName">Business Name</label>
          <input
            type="text"
            id="businessName"
            name="businessName"
            placeholder="Enter your business name"
            required
          >
        </div>

        <div class="field">
          <label for="country">Country</label>
          <input
            type="text"
            id="country"
            name="country"
            placeholder="Enter your country"
            required
          >
        </div>

        <div class="field">
          <label for="city">City / Location</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter your city or location"
            required
          >
        </div>

        <div class="field">
          <label for="category">Business Category</label>

          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option>Retail</option>
            <option>Technology</option>
            <option>Construction</option>
            <option>Transport</option>
            <option>Hospitality</option>
            <option>Education</option>
            <option>Professional Services</option>
            <option>Health & Beauty</option>
            <option>Food & Restaurant</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="description">Business Description</label>

          <textarea
            id="description"
            name="description"
            placeholder="Tell customers what your business does..."
            required
          ></textarea>
        </div>

        <div class="field">
          <label for="website">Website (optional)</label>

          <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
          >
        </div>

        <button type="submit">
          Continue Registration
        </button>

      </form> </body>
      <a class="back" href="index.html">
        ← Back to homepage
      </a>

    </div>

  </div>
<script>
const form = document.querySelector("form");

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  button.textContent = "Submitting...";

  const data = {
    businessName: document.getElementById("businessName").value.trim(),
    country: document.getElementById("country").value.trim(),
    city: document.getElementById("city").value.trim(),
    category: document.getElementById("category").value,
    description: document.getElementById("description").value.trim(),
    website: document.getElementById("website").value.trim()
  };

  try {
    const response = await fetch("/api/businesses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Registration failed.");
    }

    alert(
      "Registration successful! Your reference number is " +
      result.businessId
    );

    form.reset();
  } catch (error) {
    alert(error.message || "Unable to connect to the server.");
  } finally {
    button.disabled = false;
    button.textContent = "Continue Registration";
  }
});
</script>
</body>
</html>
